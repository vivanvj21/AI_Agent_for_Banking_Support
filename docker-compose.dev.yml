# ─────────────────────────────────────────────────────────────────────────────
# Docker Compose OVERRIDE — Development
#
# Use this to run with live code reloading and easier debugging.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or set COMPOSE_FILE in your shell:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#   docker compose up
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  api:
    # Mount source code for live reload during development
    volumes:
      - .:/app
      - /app/__pycache__
    command: >
      python -m uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
      --log-level debug
    environment:
      LOG_LEVEL: DEBUG

  streamlit:
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      LOG_LEVEL: DEBUG
