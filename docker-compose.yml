# ─────────────────────────────────────────────────────────────────────────────
# Enterprise Autonomous Bank Assistant — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

x-common-env: &common-env
  ENV: ${ENV:-production}
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/bank_db}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  API_KEY: ${API_KEY:-}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-build: &build
  context: .
  dockerfile: docker/Dockerfile

services:

  # ── PostgreSQL Database + pgvector ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bank-assistant-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bank_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis Cache & Distributed Lock Manager ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bank-assistant-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI REST API (Gunicorn + Uvicorn Async Workers) ─────────────────────
  api:
    build: *build
    container_name: bank-assistant-api
    restart: always
    environment:
      <<: *common-env
    command: >
      gunicorn -c gunicorn.conf.py api.main:app
    expose:
      - "8000"
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Streamlit UI ────────────────────────────────────────────────────────────
  streamlit:
    build: *build
    container_name: bank-assistant-ui
    restart: always
    environment:
      <<: *common-env
    command: >
      streamlit run app_streamlit.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    expose:
      - "8501"
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # ── Nginx Edge Proxy & Security Layer ──────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: bank-assistant-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
      streamlit:
        condition: service_healthy

  # ── Prometheus Metrics Collector ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: bank-assistant-prometheus
    restart: always
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - "9090"
    depends_on:
      api:
        condition: service_healthy

  # ── Grafana Metrics Visualization Dashboard ────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    container_name: bank-assistant-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  logs:
    driver: local
  promdata:
    driver: local
  grafanadata:
    driver: local
