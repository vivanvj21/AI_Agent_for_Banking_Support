<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Autonomous Bank Assistant architecture</title>
<desc>A LangGraph state machine: user input goes to a supervisor that classifies intent, routes read-only search queries directly to a search agent, and routes account or fraud queries through a deterministic identity verification gate before reaching the account agent or fraud agent. Each agent calls its own tools against a SQL database or vector store.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="620" fill="#ffffff"/>

<g>
<rect x="270" y="20" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User message</text>
</g>
<line x1="340" y1="64" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="100" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Supervisor</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Classifies intent</text>
</g>

<line x1="260" y1="156" x2="120" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="150" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">search</text>

<line x1="340" y1="156" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="380" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">account / fraud</text>

<line x1="420" y1="156" x2="560" y2="230" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="545" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">unclear</text>

<g>
<rect x="40" y="230" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="120" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Search agent</text>
<text x="120" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">No auth needed</text>
</g>

<g>
<rect x="260" y="230" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Verify gate</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Deterministic, not LLM</text>
</g>

<g>
<rect x="480" y="230" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="250" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Clarify</text>
<text x="560" y="268" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Ask what they need</text>
</g>

<line x1="120" y1="286" x2="120" y2="330" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<line x1="300" y1="286" x2="200" y2="330" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="220" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">verified</text>

<line x1="380" y1="286" x2="480" y2="330" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="460" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">verified</text>

<line x1="300" y1="286" x2="600" y2="480" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="500" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">failed 3x</text>

<g>
<rect x="40" y="330" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="120" y="352" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">search_faq</text>
</g>
<text x="120" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Chroma vector store</text>

<g>
<rect x="130" y="330" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="210" y="352" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Account agent</text>
</g>
<text x="210" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">SQLite: balance, txns</text>

<g>
<rect x="410" y="330" width="160" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="490" y="352" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Fraud agent</text>
</g>
<text x="490" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">SQLite: lock, report</text>

<g>
<rect x="520" y="440" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="590" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Human handoff</text>
<text x="590" y="478" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Ends session</text>
</g>
</svg>
