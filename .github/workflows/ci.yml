name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff

      - name: Black check
        run: python -m black --check .

      - name: Ruff check
        run: python -m ruff check .

      - name: Whitespace check
        run: git diff --check

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run tests without external API keys
        env:
          ANTHROPIC_API_KEY: ""
          VOYAGE_API_KEY: ""
        run: python -m pytest

      - name: Verify graph imports and startup check
        env:
          ANTHROPIC_API_KEY: ""
          VOYAGE_API_KEY: ""
        run: python cli.py --check-startup

  conversation-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run scripted conversation eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret is not configured; skipping optional eval."
            exit 0
          fi
          python tests/test_conversations.py
