name: CI

'on':
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Build, Test & Health Check
    runs-on: ubuntu-latest

    env:
      ENV: testing
      PERIMETER_AUTH_OPT_OUT: "true"
      ANTHROPIC_API_KEY: ""
      VOYAGE_API_KEY: ""
      PYTHONPATH: "."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python source files
        run: python -m compileall -q .

      - name: Run test suite
        run: python -m pytest

      - name: Verify CLI startup health
        run: python cli.py --check-startup
